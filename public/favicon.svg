<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F09820;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E17C16;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coolGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14B8AE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="white"/>
  
  <!-- Split design - warm top half -->
  <path d="M 50 50 L 50 2 A 48 48 0 0 1 98 50 Z" fill="url(#warmGrad)"/>
  
  <!-- Cool bottom half -->
  <path d="M 50 50 L 2 50 A 48 48 0 0 0 50 98 Z" fill="url(#coolGrad)"/>
  
  <!-- Center element - stylized PT -->
  <g transform="translate(50, 50)">
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#2D3748">
      P<tspan dx="2">T</tspan>
    </text>
  </g>
</svg>
